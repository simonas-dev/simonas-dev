<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="/feed.xml">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="ocean" aria-hidden="true"></canvas>
  <a class="logo" href="/">{{ config.title }}</a>
  <div class="page">
    <main id="main">
      {% block content %}{% endblock content %}
    </main>
  </div>
  <header class="chrome">
    <nav aria-label="Main">
      <a href="/about/">About</a>
      <a href="/posts/">Posts</a>
      <a href="/photos/">Photos</a>
    </nav>
  </header>
  <footer class="chrome">
    <small>&copy; {{ now() | date(format="%Y") }} Simonas Sankauskas</small>
    <a href="/feed.xml">RSS</a>
  </footer>
</body>
</html>
