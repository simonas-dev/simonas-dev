<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="htmx-config" content='{"refreshOnHistoryMiss":true,"includeIndicatorStyles":false}'>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="/feed.xml">
  <link rel="icon" href="/favicon.ico">
  <link rel="preload" href="/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/newsreader-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>(function(){try{var t=localStorage.getItem('theme')}catch(e){}if(t=='night'||t!='day'&&matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('theme-night')})()</script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preload" href="/shader/ocean.vert.glsl" as="fetch" crossorigin>
  <link rel="preload" href="/shader/ocean.frag.glsl" as="fetch" crossorigin>
  <script src="/ocean.js" defer></script>
  <script src="/htmx.min.js" defer></script>
  <script src="/site.js" defer></script>
</head>
<body hx-boost="true" hx-select="div.page" hx-target="div.page" hx-swap="outerHTML swap:220ms show:window:top">
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="ocean" aria-hidden="true"></canvas>
  <a class="logo" href="/">{{ config.title }}</a>
  <header class="chrome">
    <nav class="nav-inline" aria-label="Main">
      <a href="/about/">About</a>
      <a href="/posts/">Posts</a>
      <a href="/photos/">Photos</a>
    </nav>
    <details class="menu">
      <summary>Menu</summary>
      <nav class="menu-panel" aria-label="Main">
        <a href="/about/">About</a>
        <a href="/posts/">Posts</a>
        <a href="/photos/">Photos</a>
      </nav>
    </details>
  </header>
  <div class="page" hx-history-elt>
    <main id="main" tabindex="-1">
      {% block content %}{% endblock content %}
    </main>
  </div>
  <footer class="chrome">
    <small>&copy; {{ now() | date(format="%Y") }} Simonas Sankauskas · <a href="/feed.xml" hx-boost="false">RSS</a></small>
    <button type="button" class="theme-toggle" disabled aria-label="Theme: Auto">Auto</button>
  </footer>
</body>
</html>
