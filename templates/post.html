{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}

{% block content %}
<article class="content-surface{% if page.extra.wide %} wide{% endif %}">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.date %}{{ <post_meta date={page.date} reading_time={page.reading_time} /> }}{% endif %}
  </header>
  {{ page.content | safe }}
</article>
{% endblock content %}
